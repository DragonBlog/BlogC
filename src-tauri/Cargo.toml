[package]
name = "blogc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blogc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1.0.98"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
dotenv = "0.15.0"
thiserror = "2.0.12"
axum = "0.8.4"
tokio = { version = "1.47.0", features = ["full"] }
tokio-util = "0.7.15"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tauri-plugin-store = "2"
git2 = "0.20.2"
tauri-plugin-dialog = "2"
futures = "0.3.31"
notify = { version = "8.2.0", features = ["serde"] }
tauri-plugin-shell = "2"
which = "8.0.0"
tauri-plugin-fs = "2"
glob = "0.3.3"
ignore = "0.4.23"
fs_extra = "1.3.0"
tauri-plugin-http = "2"
rusqlite = { version = "0.37.0", features = ["bundled", "serde_json", "time"] }
regex = "1.11.2"
markdown = { version = "1.0.0", features = ["serde"] }
toml = "0.9.5"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
time = { version = "0.3.43", features = ["serde"] }
pathdiff = "0.2.3"
camino = "1.1.12"
urlencoding = "2.1.3"
