prepare-commit-msg:
  commands:
    "prepare commit message":
      run: pnpm cz --hook
      interactive: true
      env:
        LEFTHOOK: "0"
      

pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true  
    css:
      glob: "*.{css,scss,less}"
      run: pnpm stylelint {staged_files}  --custom-syntax postcss-less --allow-empty-input --fix
      stage_fixed: true

commit-msg:
  commands:
    "lint commit message":
      run: pnpm commitlint --edit {1}